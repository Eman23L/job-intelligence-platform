services:
  - type: web
    name: job-intelligence-backend
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SERVICE_TYPE
        value: web
      - key: DIAGNOSTIC_ADMIN_TOKEN
        sync: false
      - key: AUTONOMOUS_REAL_SUBMIT_ENABLED
        value: "false"
      - key: MAX_AUTONOMOUS_REAL_SUBMITS_PER_RUN
        value: "1"
      - key: MAX_AUTONOMOUS_FIX_ATTEMPTS_PER_ISSUE
        value: "5"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: Eman23L/job-intelligence-platform
      - key: CODEX_MENTION
        value: "@codex"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: QUEUE_ENABLED
        value: "true"
      - key: QUEUE_NAME
        value: default
      - key: RQ_RESULT_TTL_SECONDS
        value: "3600"
      - key: RQ_FAILURE_TTL_SECONDS
        value: "86400"
      - key: SCRAPE_TIMEOUT_SECONDS
        value: "600"
      - key: APPLY_TIMEOUT_SECONDS
        value: "900"
      - key: PLAYWRIGHT_STEP_TIMEOUT_MS
        value: "30000"
      - key: PAGE_NAVIGATION_TIMEOUT_MS
        value: "60000"
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: job-intelligence-redis
          property: connectionString
  - type: worker
    name: job-intelligence-worker
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: PYTHONPATH=backend python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SERVICE_TYPE
        value: worker
      - key: DIAGNOSTIC_ADMIN_TOKEN
        sync: false
      - key: AUTONOMOUS_REAL_SUBMIT_ENABLED
        value: "false"
      - key: MAX_AUTONOMOUS_REAL_SUBMITS_PER_RUN
        value: "1"
      - key: MAX_AUTONOMOUS_FIX_ATTEMPTS_PER_ISSUE
        value: "5"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: Eman23L/job-intelligence-platform
      - key: CODEX_MENTION
        value: "@codex"
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: QUEUE_ENABLED
        value: "true"
      - key: QUEUE_NAME
        value: default
      - key: RQ_RESULT_TTL_SECONDS
        value: "3600"
      - key: RQ_FAILURE_TTL_SECONDS
        value: "86400"
      - key: SCRAPE_TIMEOUT_SECONDS
        value: "600"
      - key: APPLY_TIMEOUT_SECONDS
        value: "900"
      - key: PLAYWRIGHT_STEP_TIMEOUT_MS
        value: "30000"
      - key: PAGE_NAVIGATION_TIMEOUT_MS
        value: "60000"
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: job-intelligence-redis
          property: connectionString
  - type: redis
    name: job-intelligence-redis
    ipAllowList: []
