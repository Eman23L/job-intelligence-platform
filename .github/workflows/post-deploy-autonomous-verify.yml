name: Post Deploy Autonomous Verify

on:
  workflow_run:
    workflows:
      - CI Deploy Render
    types:
      - completed
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare report directory
        run: mkdir -p backend/runtime/post_deploy_autonomous_verify

      - name: Rerun affected safe diagnostics
        continue-on-error: true
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          DIAGNOSTIC_ADMIN_TOKEN: ${{ secrets.DIAGNOSTIC_ADMIN_TOKEN }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          root = "backend/runtime/post_deploy_autonomous_verify"
          backend = (os.environ.get("BACKEND_API_BASE_URL") or "").rstrip("/")
          diagnostic_token = os.environ.get("DIAGNOSTIC_ADMIN_TOKEN") or ""
          github_token = os.environ.get("CODEX_GITHUB_TOKEN") or ""
          repo = os.environ.get("GITHUB_REPOSITORY") or ""
          output = {"status": "skipped", "applications": []}

          def request_json(method, url, body=None, headers=None):
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8") or "{}")

          if not (backend and diagnostic_token and github_token and repo):
              output["reason"] = "missing BACKEND_API_BASE_URL, DIAGNOSTIC_ADMIN_TOKEN, CODEX_GITHUB_TOKEN, or GITHUB_REPOSITORY"
          else:
              gh_headers = {"Authorization": f"Bearer {github_token}", "Accept": "application/vnd.github+json"}
              labels = "autonomous-canary,assist-apply"
              issues = request_json("GET", f"https://api.github.com/repos/{repo}/issues?state=open&labels={labels}&per_page=100", headers=gh_headers)
              app_ids = sorted({int(match.group(1)) for issue in issues for match in [re.search(r"application (\d+)", issue.get("title", ""), re.I)] if match})
              output = {"status": "completed", "applications": []}
              api_headers = {"Authorization": f"Bearer {diagnostic_token}", "Content-Type": "application/json"}
              for app_id in app_ids:
                  item = {"application_id": app_id, "status": "queued"}
                  output["applications"].append(item)
                  try:
                      started = request_json("POST", f"{backend}/diagnostics/assist-apply/{app_id}", {"user_id": 1, "safe_mode": True, "submit_allowed": False}, api_headers)
                      run_id = started["run_id"]
                      item["run_id"] = run_id
                      for _ in range(40):
                          state = request_json("GET", f"{backend}/diagnostics/assist-apply/runs/{run_id}", headers=api_headers)
                          item["status"] = state.get("status")
                          item["failed_phase"] = ((state.get("final_report") or {}).get("failed_phase"))
                          item["exact_error"] = ((state.get("final_report") or {}).get("exact_error"))
                          item["artifact_links"] = state.get("artifact_links") or []
                          if item["status"] in {"passed", "failed"}:
                              break
                          time.sleep(15)
                  except Exception as exc:
                      item["status"] = "failed"
                      item["failed_phase"] = "affected_safe_diagnostic_failed"
                      item["exact_error"] = str(exc)
          open(f"{root}/affected_diagnostics.json", "w", encoding="utf-8").write(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Run autonomous verification
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          DIAGNOSTIC_ADMIN_TOKEN: ${{ secrets.DIAGNOSTIC_ADMIN_TOKEN }}
        run: |
          root=backend/runtime/post_deploy_autonomous_verify
          write_report() {
            python -c 'import json, os, sys; report={"status":"failed","failed_phase":os.environ["FAILED_PHASE"],"exact_error":os.environ["EXACT_ERROR"],"recommended_fix":os.environ["RECOMMENDED_FIX"]}; open(sys.argv[1],"w",encoding="utf-8").write(json.dumps(report, indent=2, sort_keys=True))' "$root/result.json"
          }
          if [ -z "$BACKEND_API_BASE_URL" ]; then
            FAILED_PHASE=backend_api_base_url_missing EXACT_ERROR="BACKEND_API_BASE_URL secret is not configured." RECOMMENDED_FIX="Set BACKEND_API_BASE_URL to the FastAPI backend base URL." write_report
            exit 1
          fi
          if [ -z "$DIAGNOSTIC_ADMIN_TOKEN" ]; then
            FAILED_PHASE=diagnostic_admin_token_missing EXACT_ERROR="DIAGNOSTIC_ADMIN_TOKEN secret is not configured." RECOMMENDED_FIX="Set DIAGNOSTIC_ADMIN_TOKEN in GitHub repository secrets." write_report
            exit 1
          fi
          backend_base="${BACKEND_API_BASE_URL%/}"
          health_code=$(curl -sS -o "$root/health.json" -w "%{http_code}" "$backend_base/health")
          if [ "$health_code" -lt 200 ] || [ "$health_code" -ge 300 ]; then
            tail_body=$(tail -c 1000 "$root/health.json")
            FAILED_PHASE=backend_api_unreachable EXACT_ERROR="backend health check failed with HTTP $health_code. Body tail: $tail_body" RECOMMENDED_FIX="Verify BACKEND_API_BASE_URL points to the FastAPI backend and the Render web service is healthy." write_report
            exit 1
          fi
          echo "post_deploy_autonomous_verify_start"
          run_code=$(curl -sS -o "$root/result.json" -w "%{http_code}" -X POST "$backend_base/applications/autonomous-real-submit")
          if [ "$run_code" -lt 200 ] || [ "$run_code" -ge 300 ]; then
            tail_body=$(tail -c 1000 "$root/result.json")
            FAILED_PHASE=autonomous_verify_endpoint_failed EXACT_ERROR="autonomous verify endpoint failed with HTTP $run_code. Body tail: $tail_body" RECOMMENDED_FIX="Inspect the backend applications autonomous-real-submit route." write_report
            exit 1
          fi
          python -c 'import json, sys; report=json.load(open("backend/runtime/post_deploy_autonomous_verify/result.json", encoding="utf-8")); print("post_deploy_autonomous_verify_done"); sys.exit(1 if report.get("failed_phase") or report.get("status") == "failed" else 0)'

      - name: Build handoff payload
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          root=backend/runtime/post_deploy_autonomous_verify
          if [ ! -f "$root/result.json" ]; then
            python -c 'import json; report={"status":"failed","failed_phase":"post_deploy_verify_no_report","exact_error":"Verification exited before writing result.json.","recommended_fix":"Inspect workflow logs and backend availability."}; open("backend/runtime/post_deploy_autonomous_verify/result.json","w",encoding="utf-8").write(json.dumps(report, indent=2, sort_keys=True))'
          fi
          python -c 'import json, os; root="backend/runtime/post_deploy_autonomous_verify"; report=json.load(open(f"{root}/result.json", encoding="utf-8")); report.setdefault("latest_commit_sha", os.environ.get("GITHUB_SHA")); open(f"{root}/result.json", "w", encoding="utf-8").write(json.dumps(report, indent=2, sort_keys=True)); open(f"{root}/handoff_payload.json", "w", encoding="utf-8").write(json.dumps({"report": report}, indent=2, sort_keys=True))'

      - name: Ensure Codex handoff is recorded
        if: always()
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          DIAGNOSTIC_ADMIN_TOKEN: ${{ secrets.DIAGNOSTIC_ADMIN_TOKEN }}
        run: |
          root=backend/runtime/post_deploy_autonomous_verify
          if [ -n "$BACKEND_API_BASE_URL" ] && [ -n "$DIAGNOSTIC_ADMIN_TOKEN" ]; then
            backend_base="${BACKEND_API_BASE_URL%/}"
            curl -sS -o "$root/handoff_response.json" -X POST "$backend_base/diagnostics/handoff/codex" \
              -H "Authorization: Bearer $DIAGNOSTIC_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$root/handoff_payload.json" || true
          fi

      - name: Upload autonomous verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-autonomous-verify
          path: backend/runtime/post_deploy_autonomous_verify/**
