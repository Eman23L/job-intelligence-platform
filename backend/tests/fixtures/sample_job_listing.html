<!doctype html>
<html lang="en">
  <head>
    <title>Demo Jobs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Data Analyst",
        "hiringOrganization": {"name": "Example Analytics"}
      }
    </script>
  </head>
  <body>
    <main>
      <article class="job-card" data-job-id="demo-001">
        <h2 class="job-title">Data Analyst</h2>
        <p class="company">Example Analytics</p>
        <p class="location">London hybrid</p>
        <p class="salary">£45000 - £55000</p>
        <span class="posted">2 days ago</span>
        <p class="description">Analyse product and operations data with SQL and Python.</p>
        <a class="apply-link" href="https://example.invalid/jobs/demo-001">Apply</a>
      </article>
      <article class="job-card" data-job-id="demo-002">
        <h2 class="job-title">Junior BI Developer</h2>
        <p class="company">Example Reports Ltd</p>
        <p class="location">Remote UK</p>
        <p class="salary">GBP 35000 to 42000</p>
        <span class="posted">2026-05-10</span>
        <p class="description">Build dashboards and maintain reporting datasets.</p>
        <a class="apply-link" href="https://example.invalid/jobs/demo-002">Apply</a>
      </article>
    </main>
  </body>
</html>
